name: Build Armbian firmware

on:
  push:
    branches: [main]
    paths:
      - 'houzzkit-f1-bsp-k6199/**'
      - 'houzzkit-f1-rootfs-armbian/**'
      - 'houzzkit-f1-rootfs-u2404/ubuntu-rootfs/usr/lib/firmware/**'
      - 'htool/**'
      - '.github/scripts/build-firmware.sh'
      - '.github/workflows/firmware-armbian.yml'
      - '.github/workflows/firmware-build.yml'
      - '.github/workflows/firmware-release.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'houzzkit-f1-bsp-k6199/**'
      - 'houzzkit-f1-rootfs-armbian/**'
      - 'houzzkit-f1-rootfs-u2404/ubuntu-rootfs/usr/lib/firmware/**'
      - 'htool/**'
      - '.github/scripts/build-firmware.sh'
      - '.github/workflows/firmware-armbian.yml'
      - '.github/workflows/firmware-build.yml'
      - '.github/workflows/firmware-release.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/firmware-build.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      flavor: armbian

  release:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/firmware-release.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      firmware_prefix: ${{ needs.build.outputs.firmware_prefix }}
      artifact_name: houzzkit-firmware-armbian
