name: Build Rockchip firmware image

on:
  workflow_call:
    inputs:
      source_sha:
        description: Commit to build and package
        required: true
        type: string
      flavor:
        default: ubuntu
        type: string
      firmware_version:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Make space for the Rockchip SDK
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"
          free_mib=$(df -Pm "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          if ((free_mib < 28672)); then
            echo "::error::The SDK, rootfs and package intermediates need at least 28 GiB free before checkout."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false

      - name: Test and cross-compile htoold
        working-directory: htool
        run: |
          go test -race ./...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/htoold-arm64" .

      - name: Build the ARM64 PAM helper
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross libpam0g-dev
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -Werror -idirafter /usr/include \
            htool/pam/verify.c -o "$RUNNER_TEMP/htoold-pam-arm64" -ldl
          aarch64-linux-gnu-readelf -h "$RUNNER_TEMP/htoold-pam-arm64" | grep 'Machine:.*AArch64'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            acl bc binfmt-support bison bsdextrautils build-essential bzip2 chrpath \
            cpio curl device-tree-compiler diffstat e2fsprogs expect fakeroot file flex \
            g++-multilib gawk gcc-multilib git kmod libelf-dev libgmp-dev liblz4-tool libmpc-dev \
            libncurses-dev libssl-dev live-build openssh-client patchelf pkg-config \
            python2 python3 python3-pip qemu-user-static rsync schroot texinfo time \
            u-boot-tools unzip uuid-dev xz-utils zlib1g-dev zstd

      - name: Build and compress the flash image
        env:
          FLAVOR: ${{ inputs.flavor }}
          FIRMWARE_VERSION: ${{ inputs.firmware_version }}
        run: bash .github/scripts/build-firmware.sh "$FLAVOR"

      - name: Upload firmware
        uses: actions/upload-artifact@v6
        with:
          name: houzzkit-firmware-${{ inputs.flavor }}
          path: |
            ${{ runner.temp }}/houzzkit-firmware.img.zst
            ${{ runner.temp }}/houzzkit-firmware.json
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
