name: Build Rockchip firmware image

on:
  workflow_call:
    inputs:
      source_sha:
        description: Commit to build and package
        required: true
        type: string
      flavor:
        default: ubuntu
        type: string
    outputs:
      firmware_prefix:
        value: ${{ jobs.build.outputs.firmware_prefix }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    outputs:
      firmware_prefix: ${{ steps.variant.outputs.firmware_prefix }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Make space for the Rockchip SDK
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"
          free_mib=$(df -Pm "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          if ((free_mib < 28672)); then
            echo "::error::The SDK, rootfs and package intermediates need at least 28 GiB free before checkout."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false

      - name: Test and cross-compile htool
        working-directory: htool
        run: |
          go test -race ./...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/htool-arm64" .

      - name: Resolve firmware variant
        id: variant
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          case "$FLAVOR" in
            ubuntu) prefix=houzzkit-firmware-ubuntu_24_04 ;;
            armbian)
              source houzzkit-f1-rootfs-armbian/version.env
              prefix="houzzkit-firmware-armbian_$ARMBIAN_VERSION"
              ;;
            *) exit 1 ;;
          esac
          printf 'firmware_prefix=%s\n' "$prefix" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acl bc binfmt-support bison bsdextrautils build-essential bzip2 chrpath \
            cpio curl device-tree-compiler diffstat e2fsprogs expect fakeroot file flex \
            g++-multilib gawk gcc-multilib git kmod libelf-dev libgmp-dev liblz4-tool libmpc-dev \
            libncurses-dev libssl-dev live-build openssh-client patchelf pkg-config \
            python2 python3 python3-pip qemu-user-static rsync schroot texinfo time \
            u-boot-tools unzip uuid-dev xz-utils zlib1g-dev zstd

      - name: Build and compress the flash image
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: bash .github/scripts/build-firmware.sh "$FLAVOR"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: houzzkit-firmware-${{ inputs.flavor }}
          path: ${{ runner.temp }}/houzzkit-firmware.img.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
