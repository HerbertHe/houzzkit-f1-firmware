name: Publish Rockchip firmware

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      firmware_version:
        required: true
        type: string
      artifact_name:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    # Fork builds keep their downloadable Actions artifact and use a read-only token.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      FIRMWARE_VERSION: ${{ inputs.firmware_version }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/firmware-release

      - name: Publish to GitHub Releases
        working-directory: ${{ runner.temp }}/firmware-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$FIRMWARE_VERSION"
          [[ "$tag" =~ ^houzzkit-firmware-(ubuntu|armbian)-[0-9]{4}_[0-9]{2}_[0-9]{2}(_[1-9][0-9]*)?$ ]]
          flavor=${BASH_REMATCH[1]}
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          owner="Firmware build run $GITHUB_RUN_ID"
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq 'select(.object.type == "tag") | .object.sha')
          [[ -n "$object" ]]
          gh api "repos/$GH_REPO/git/tags/$object" |
            jq -e --arg owner "$owner" --arg sha "$SOURCE_SHA" \
              '.message == $owner and .object.type == "commit" and .object.sha == $sha' >/dev/null

          # Authenticated release listing includes drafts, unlike lookup by published tag.
          existing=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | [.id, .draft] | @tsv")
          if [[ -n "$existing" ]]; then
            IFS=$'\t' read -r release_id draft <<< "$existing"
            [[ "$release_id" =~ ^[0-9]+$ ]]
            if [[ "$draft" == false ]]; then
              printf 'Release %s was already published.\n' "$tag"
              exit 0
            fi
            [[ "$draft" == true ]]
          fi
          metadata=$(jq -er --arg tag "$tag" --arg sha "$SOURCE_SHA" --arg flavor "$flavor" \
            --arg run "$GITHUB_RUN_ID" '
              select(.version == $tag and .source_commit == $sha and .flavor == $flavor and
                .board == "houzzkit-force1" and .build_run_id == $run and
                .partition_layout_id == "rockchip-gpt-single-rootfs-v1" and
                (.partition_template_sha256 | test("^[a-f0-9]{64}$")) and
                (.distribution_version | test("^[0-9A-Za-z._-]+$")) and
                (.kernel_release | test("^[0-9][A-Za-z0-9._+-]*$"))) |
              [.distribution_version, .kernel_release, .partition_layout_id] | @tsv
            ' houzzkit-firmware.json)
          IFS=$'\t' read -r distro kernel_release layout <<< "$metadata"
          draft_options=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            draft_options=(--prerelease)
          fi

          image="$tag.img.zst"
          notes=$(mktemp)
          {
            printf 'Distribution: %s %s\n\n' "$flavor" "$distro"
            printf 'BSP kernel: `%s`\n\n' "$kernel_release"
            printf 'Partition layout: `%s`\n\n' "$layout"
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Build: %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID"
            if [[ -n "$PR_NUMBER" ]]; then
              printf 'Preview build from PR #%s.\n\n' "$PR_NUMBER"
            fi
          } > "$notes"
          mv houzzkit-firmware.img.zst "$image"
          assets=("$image")
          if (( $(stat -c %s "$image") >= 2000000000 )); then
            split -b 1900MB -d -a 3 "$image" "$image.part-"
            assets=("$image".part-*)
            printf 'Join the parts: `cat %s.part-* > %s`\n\n' "$image" "$image" >> "$notes"
          fi
          printf 'Verify the downloads with `sha256sum -c %s.sha256`.\n\n' "$tag" >> "$notes"
          printf 'Unpack the flashable image with `zstd -d %s`.\n' "$image" >> "$notes"
          sha256sum "${assets[@]}" > "$tag.sha256"
          if [[ -n "$existing" ]]; then
            # A rebuild can change the bytes or number of parts. Only reset our draft.
            previous=$(gh api --paginate "repos/$GH_REPO/releases/$release_id/assets?per_page=100" --jq '.[].id')
            while IFS= read -r asset_id; do
              [[ -n "$asset_id" ]] || continue
              gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id" --silent
            done <<< "$previous"
          else
            gh release create "$tag" --draft --verify-tag --title "$tag" \
              --notes-file "$notes" "${draft_options[@]}"
          fi
          mv houzzkit-firmware.json "$tag.json"
          gh release upload "$tag" "${assets[@]}" "$tag.sha256" "$tag.json"
          gh release edit "$tag" --draft=false --verify-tag --notes-file "$notes" --latest=false

  update-latest:
    needs: release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    # The repository badge is informational. The firmware is already public.
    continue-on-error: true
    permissions:
      contents: write
    concurrency:
      group: houzzkit-firmware-repository-latest
      queue: max
    steps:
      - name: Mark the newest official firmware release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-read published releases inside the shared queue. A build that
          # finishes late cannot promote an older version over a newer one.
          find_latest() {
            timeout 40s gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
              jq -ser '
              [ .[][] |
                select(.draft == false and .prerelease == false and .published_at != null) |
                .tag_name as $tag |
                ($tag | capture("^houzzkit-firmware-(?<flavor>ubuntu|armbian)-(?<day>[0-9]{4}_[0-9]{2}_[0-9]{2})(?:_(?<seq>[1-9][0-9]*))?$")) |
                {tag: $tag, day, seq: ((.seq // "0") | tonumber), prefer_armbian: (.flavor == "armbian")}
              ] |
              max_by([.day, .seq, .prefer_armbian]) | .tag // empty
              '
          }
          for attempt in 1 2 3; do
            if latest=$(find_latest) && timeout 40s gh release edit "$latest" --latest; then
              exit 0
            fi
            printf 'Latest update attempt %s of 3 failed.\n' "$attempt" >&2
            if [[ "$attempt" != 3 ]]; then
              sleep "$((attempt * 3))"
            fi
          done
          echo "::warning::The firmware release is available. The GitHub Latest badge could not be refreshed."
          exit 1
