name: Build Ubuntu firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Make space for the Rockchip SDK
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE"
          free_mib=$(df -Pm "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          if ((free_mib < 28672)); then
            echo "::error::The SDK, rootfs and package intermediates need at least 28 GiB free before checkout."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            acl bc binfmt-support bison bsdextrautils build-essential bzip2 chrpath \
            cpio curl device-tree-compiler diffstat e2fsprogs expect fakeroot file flex \
            g++-multilib gawk gcc-multilib git kmod libelf-dev liblz4-tool \
            libncurses-dev libssl-dev live-build openssh-client patchelf pkg-config \
            python2 python3 python3-pip qemu-user-static rsync schroot texinfo \
            u-boot-tools unzip uuid-dev xz-utils zlib1g-dev zstd

      - name: Build and compress the flash image
        run: bash .github/scripts/build-firmware.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: houzzkit-firmware-ubuntu
          path: ${{ runner.temp }}/houzzkit-firmware.img.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: build
    # Fork builds keep their downloadable Actions artifact and use a read-only token.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TZ: Asia/Shanghai
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: houzzkit-firmware-ubuntu
          path: ${{ runner.temp }}/firmware-release

      - name: Publish to GitHub Releases
        working-directory: ${{ runner.temp }}/firmware-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="houzzkit-firmware-ubuntu_24_04-$(date +%Y_%m_%d)"
          release_options=(--latest)
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            release_options=(--prerelease --latest=false)
          fi

          # The create-ref API reserves a unique name even when builds finish together.
          # Both stable releases and PR prereleases use the same daily sequence.
          for ((number = 0; ; number++)); do
            tag="$base"
            if ((number > 0)); then
              tag="${base}_${number}"
            fi
            if response=$(gh api "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$SOURCE_SHA" 2>&1); then
              break
            fi
            if ! gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent; then
              printf '%s\n' "$response" >&2
              exit 1
            fi
          done

          image="$tag.img.zst"
          notes=$(mktemp)
          {
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Build: %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID"
            if [[ -n "$PR_NUMBER" ]]; then
              printf 'Preview build from PR #%s.\n\n' "$PR_NUMBER"
            fi
          } > "$notes"
          mv houzzkit-firmware.img.zst "$image"
          assets=("$image")
          if (( $(stat -c %s "$image") >= 2000000000 )); then
            split -b 1900MB -d -a 3 "$image" "$image.part-"
            assets=("$image".part-*)
            printf 'Join the parts: `cat %s.part-* > %s`\n\n' "$image" "$image" >> "$notes"
          fi
          printf 'Verify the downloads with `sha256sum -c %s.sha256`.\n\n' "$tag" >> "$notes"
          printf 'Unpack the flashable image with `zstd -d %s`.\n' "$image" >> "$notes"
          sha256sum "${assets[@]}" > "$tag.sha256"
          gh release create "$tag" "${assets[@]}" "$tag.sha256" \
            --verify-tag --title "$tag" --notes-file "$notes" "${release_options[@]}"
