name: Build Ubuntu firmware

on:
  push:
    branches: [main]
    paths:
      - 'houzzkit-f1-bsp-k6199/**'
      - 'houzzkit-f1-rootfs-ubuntu/**'
      - 'htool/**'
      - '.github/scripts/build-firmware.sh'
      - '.github/scripts/configure-apt-sources.sh'
      - '.github/scripts/install-ubuntu-compose.sh'
      - '.github/workflows/firmware-version.yml'
      - '.github/scripts/restore-rootfs.py'
      - '.github/workflows/firmware.yml'
      - '.github/workflows/firmware-build.yml'
      - '.github/workflows/firmware-release.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'houzzkit-f1-bsp-k6199/**'
      - 'houzzkit-f1-rootfs-ubuntu/**'
      - 'htool/**'
      - '.github/scripts/build-firmware.sh'
      - '.github/scripts/configure-apt-sources.sh'
      - '.github/scripts/install-ubuntu-compose.sh'
      - '.github/workflows/firmware-version.yml'
      - '.github/scripts/restore-rootfs.py'
      - '.github/workflows/firmware.yml'
      - '.github/workflows/firmware-build.yml'
      - '.github/workflows/firmware-release.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/firmware-version.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      flavor: ubuntu

  build:
    needs: version
    uses: ./.github/workflows/firmware-build.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      flavor: ubuntu
      firmware_version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, build]
    permissions:
      contents: write
    uses: ./.github/workflows/firmware-release.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      firmware_version: ${{ needs.version.outputs.version }}
      artifact_name: houzzkit-firmware-ubuntu
